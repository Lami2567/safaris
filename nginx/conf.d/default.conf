# ==============================================================================
# SAFARIS API Gateway - NGINX Reverse Proxy Configuration (HTTP & IP Testing)
# ==============================================================================

upstream safaris_api {
    server backend:3000;
    keepalive 32;
}

upstream safaris_admin {
    server admin:3001;
    keepalive 32;
}

# Rate limiting zone (60 requests/minute per client IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# ==============================================================================
# Admin Dashboard Virtual Host: admin.mumwesafarisuganda.com
# ==============================================================================
server {
    listen 80;
    listen 3001;
    server_name admin.mumwesafarisuganda.com;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://safaris_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    server_name _;


    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME-challenge for Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # GitHub Webhook (Automated Vercel/Render-style deployments)
    location /webhook {
        proxy_pass http://172.18.0.1:9000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Health Check (Direct proxy for VPS monitoring & Docker health checks)
    location /health {
        proxy_pass http://safaris_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API Gateway Reverse Proxy
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://safaris_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Real-Time WebSocket Proxying
    location /socket.io/ {
        proxy_pass http://safaris_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Dashboard via IP subpath fallback
    location /admin/ {
        proxy_pass http://safaris_admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root informational endpoint
    location / {
        default_type application/json;
        return 200 '{"status":"active","platform":"SAFARIS Uganda API Gateway","documentation":"/api/v1/health","admin_dashboard":"/admin or port 3001"}';
    }
}

