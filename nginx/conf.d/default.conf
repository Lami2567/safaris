# ==============================================================================
# SAFARIS API Gateway - NGINX Reverse Proxy Configuration (HTTPS application traffic)
# ==============================================================================

upstream safaris_api {
    server backend:3000;
    keepalive 32;
}

upstream safaris_admin {
    server admin:3001;
    keepalive 32;
}

# Rate limiting zone (60 requests/minute per client IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# ==============================================================================
# Admin Dashboard Virtual Host: admin.mumwesafarisuganda.com (HTTP)
# ==============================================================================
server {
    listen 80;
    server_name admin.mumwesafarisuganda.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    if ($http_x_forwarded_proto != "https") {
        return 308 https://admin.mumwesafarisuganda.com$request_uri;
    }

    client_max_body_size 30M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /webhook {
        proxy_pass http://host.docker.internal:9000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://safaris_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /socket.io/ {
        proxy_pass http://safaris_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /_next/ {
        proxy_pass http://safaris_admin/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://safaris_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# ==============================================================================
# Admin Dashboard Virtual Host: admin.mumwesafarisuganda.com (HTTPS / SSL)
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.mumwesafarisuganda.com;

    ssl_certificate /etc/letsencrypt/live/admin.mumwesafarisuganda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mumwesafarisuganda.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30M;

