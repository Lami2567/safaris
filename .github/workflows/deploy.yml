name: Deploy SAFARIS Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Continuous Deployment
        run: |
          echo "Triggering VPS deployment webhook..."
          curl -X POST http://18.222.41.199/webhook \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/main"}' \
            --max-time 15 || echo "Webhook trigger completed."
