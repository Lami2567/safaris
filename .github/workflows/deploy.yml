name: Build, Verify & Deploy SAFARIS Backend

on:
  push:
    branches:
      - main

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safaris_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: safaris_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safaris_test -d safaris_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Master Verification & Security Regression Suites
        run: npm test

      - name: Dashboard build and type checking
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --prefix admin --ignore-scripts --no-audit --no-fund
          npm run build --prefix admin
          node node_modules/typescript/bin/tsc --noEmit -p admin/tsconfig.json

      - name: PostgreSQL multi-process transaction and revocation tests
        env:
          NODE_ENV: test
          DISABLE_DATABASE: 'true'
          SAFARIS_TEST_DATA_DIR: ${{ runner.temp }}/safaris-pg-boundaries
          SAFARIS_PG_TEST_URL: postgresql://safaris_test:isolated_ci_password@127.0.0.1:5432/safaris_security_test
        run: |
          mkdir -p "$SAFARIS_TEST_DATA_DIR"
          npm run test:postgres

      - name: Python deployment handler regression tests
        run: python3 -m unittest discover -s scripts -p 'test_autodeploy.py'

      - name: HTTPS, proxy identity, WebSocket and SSE regression tests
        run: |
          bash -n scripts/deploy.sh
          python3 scripts/test_nginx_security.py

      - name: Trigger Authenticated VPS Continuous Deployment
        if: success() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET || secrets.DEPLOY_WEBHOOK_SECRET || secrets.DEPLOY_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::GITHUB_WEBHOOK_SECRET is not configured in GitHub repository settings. Deployment cannot proceed without authentication."
            exit 1
          fi

          PAYLOAD=$(cat <<EOF
          {"ref": "refs/heads/main", "commit": "$COMMIT_SHA", "repository": "Lami2567/safaris"}
          EOF
          )

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          echo "Submitting authenticated deployment webhook to VPS (Commit: $COMMIT_SHA)..."

          curl -sS --fail-with-body -X POST https://admin.mumwesafarisuganda.com/webhook \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" --max-time 45
          for attempt in $(seq 1 180); do
            STATUS=$(curl -fsS --max-time 10 https://admin.mumwesafarisuganda.com/webhook 2>/dev/null || echo "{}")
            if echo "$STATUS" | jq -e --arg sha "$COMMIT_SHA" '.last_deployed_commit == $sha and (.last_deploy_status == "success" or .last_deploy_status == "none") and .is_deploying == false' >/dev/null 2>&1; then
              echo "✅ Deployment verified: commit $COMMIT_SHA is active on VPS."
              exit 0
            fi
            if echo "$STATUS" | jq -e --arg sha "$COMMIT_SHA" '.target_commit == $sha and (.last_deploy_status | startswith("failed"))' >/dev/null 2>&1; then
              echo "::error::Server deployment failed: $(echo "$STATUS" | jq -r .last_deploy_status 2>/dev/null)"
              exit 1
            fi
            if [ $((attempt % 3)) -eq 0 ]; then
              DEPLOYING=$(echo "$STATUS" | jq -r .is_deploying 2>/dev/null || echo "unknown")
              DEPLOY_STATUS=$(echo "$STATUS" | jq -r .status 2>/dev/null || echo "unknown")
              echo "Waiting for deployment to complete... (Attempt $attempt/180, is_deploying: $DEPLOYING, status: $DEPLOY_STATUS)"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for exact deployed commit"
          exit 1
