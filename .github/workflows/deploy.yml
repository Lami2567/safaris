name: Build, Verify & Deploy SAFARIS Backend

on:
  push:
    branches:
      - main

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Master Verification & Security Regression Suites
        run: npm test

      - name: Trigger Authenticated VPS Continuous Deployment
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET || secrets.DEPLOY_WEBHOOK_SECRET || secrets.DEPLOY_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::GITHUB_WEBHOOK_SECRET is not configured in GitHub repository settings. Deployment cannot proceed without authentication."
            exit 1
          fi

          PAYLOAD=$(cat <<EOF
          {"ref": "refs/heads/main", "commit": "$COMMIT_SHA", "repository": "Lami2567/safaris"}
          EOF
          )

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          echo "Submitting authenticated deployment webhook to VPS (Commit: $COMMIT_SHA)..."

          # Prefer HTTPS endpoint through Nginx reverse proxy with fallback to direct port
          curl -sS --fail-with-body -X POST https://admin.mumwesafarisuganda.com/webhook \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            --max-time 45 || \
          curl -sS --fail-with-body -X POST http://18.222.41.199:9000/webhook \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            --max-time 45
